name: gdmerp-backend-dev

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: gdmerp-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: 123456
      APP_USER: GDMERP_APP
      APP_USER_PASSWORD: 123456
    ports:
      - "21521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  oracle_data: