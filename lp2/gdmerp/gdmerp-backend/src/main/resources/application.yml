# Configuración global de la aplicación
spring:
  application:
    name: gdmerp-backend

  # Perfil de desarrollo por defecto
  profiles:
    active: dev

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

# Configuración de Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    prometheus:
      enabled: true

gdmerp:
  cors:
    allowed-origins: "http://localhost:4200,http://127.0.0.1:4200"
