app.init.demo-data=false

# Base de datos en memoria H2 para aislamiento de pruebas unitarias y de contexto
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS GDM_CATALOGO\\;CREATE SCHEMA IF NOT EXISTS GDM_COMPRAS\\;CREATE SCHEMA IF NOT EXISTS GDM_CRM\\;CREATE SCHEMA IF NOT EXISTS GDM_INVENTARIO\\;CREATE SCHEMA IF NOT EXISTS GDM_PRODUCCION\\;CREATE SCHEMA IF NOT EXISTS GDM_VENTAS
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecto y DDL para H2 en pruebas
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Deshabilitar cache Redis externo durante pruebas unitarias
spring.cache.type=none
spring.data.redis.repositories.enabled=false

# Configuración de seguridad para tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:38080/realms/gdmerp
