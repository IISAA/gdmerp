<aside style="width: 250px; background: #1f2937; color: white; height: 100vh; padding: 1rem; display: flex; flex-direction: column;">
  <div style="margin-bottom: 2rem;">
    <h2 style="margin: 0; font-size: 1.5rem; font-weight: bold; color: #f59e0b;">GDMERP</h2>
    <span style="font-size: 0.8rem; color: #9ca3af;">Producción & Retail</span>
  </div>
  <nav style="display: flex; flex-direction: column; gap: 0.5rem;">
    <!-- Dashboard / Inicio general -->
    <a routerLink="/home" routerLinkActive="active" style="color: #d1d5db; text-decoration: none; padding: 0.75rem; border-radius: 0.375rem; display: flex; align-items: center; gap: 0.5rem;">
      <span>🏠</span> Inicio
    </a>

    <!-- Módulo de Producción (Órdenes, Centros de Trabajo) -->
    <a *hasRole="['ADMIN', 'JEFE_PRODUCCION']" routerLink="/produccion/ordenes" routerLinkActive="active" style="color: #d1d5db; text-decoration: none; padding: 0.75rem; border-radius: 0.375rem; display: flex; align-items: center; gap: 0.5rem;">
      <span>🏭</span> Tablero de Producción
    </a>

    <!-- Módulo de Inventario (Productos, Almacenes, Categorías) -->
    <a *hasRole="['ADMIN', 'ALMACENERO']" routerLink="/inventario" routerLinkActive="active" style="color: #d1d5db; text-decoration: none; padding: 0.75rem; border-radius: 0.375rem; display: flex; align-items: center; gap: 0.5rem;">
      <span>📦</span> Inventario y Kardex
    </a>

    <!-- Módulo de Punto de Venta / Ventas -->
    <a *hasRole="['ADMIN', 'VENDEDOR', 'CAJERO']" routerLink="/ventas" routerLinkActive="active" style="color: #d1d5db; text-decoration: none; padding: 0.75rem; border-radius: 0.375rem; display: flex; align-items: center; gap: 0.5rem;">
      <span>💰</span> Punto de Venta
    </a>
  </nav>
</aside>
