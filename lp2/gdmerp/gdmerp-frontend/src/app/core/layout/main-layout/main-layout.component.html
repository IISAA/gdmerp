<mat-sidenav-container class="global-layout-container">
  <!-- Sidebar lateral izquierdo fijo -->
  <mat-sidenav mode="side" opened [disableClose]="true" class="global-sidenav">
    <app-sidebar></app-sidebar>
  </mat-sidenav>

  <!-- Contenedor derecho de contenido -->
  <mat-sidenav-content class="global-sidenav-content">
    <!-- Contenedor del router-outlet con scroll independiente -->
    <main class="page-content-scroll">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
